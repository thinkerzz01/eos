<title>PAID Stamp Preview</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#eef0f6;padding:24px;color:#171A2B}
  .card{position:relative;max-width:760px;margin:0 auto;background:rgba(91,71,214,.06);border:1px solid rgba(91,71,214,.12);border-radius:20px;padding:24px;display:flex;align-items:center;gap:20px}
  .icon{width:56px;height:56px;border-radius:16px;background:rgba(91,71,214,.12);display:flex;align-items:center;justify-content:center;font-size:24px;color:#5B47D6}
  .label{font-size:13px;color:#64748b;font-weight:500}
  .amt{font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em}
  .due{color:#5B47D6;font-weight:500;margin-top:8px;font-size:14px}
  /* PAID stamp - mirrors the React component's classes */
  .stamp{position:absolute;top:12px;right:24px;transform:rotate(-12deg);z-index:10}
  .stamp-inner{display:flex;align-items:center;gap:8px;background:#16A34A;border-radius:8px;padding:10px 20px}
  .stamp-text{color:#fff;font-weight:800;letter-spacing:.03em;font-size:30px;line-height:1}
  .stamp-check{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9999px;border:2px solid #fff}
  .stamp-check svg{width:18px;height:18px;stroke:#fff;stroke-width:3;fill:none}
  .note{max-width:760px;margin:18px auto 0;font-size:13px;color:#64748b}
</style>
<div class="card">
  <div class="stamp">
    <div class="stamp-inner">
      <span class="stamp-text">PAID</span>
      <span class="stamp-check"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
    </div>
  </div>
  <div class="icon">&#128179;</div>
  <div>
    <div class="label">Amount To Pay</div>
    <div class="amt">PKR 20,000</div>
    <div class="due">&#128197; Due Date: 10 October 2026</div>
  </div>
</div>
<p class="note">Preview of the PAID stamp as it renders on a paid voucher (solid #16A34A, white check in a circle, ~12&deg; tilt, rounded corners, no shadow/texture). It appears only when a voucher's status is Paid and never overlaps the amount or due date.</p>
